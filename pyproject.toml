[project]
name = "ctfbench-claude"
version = "0.1.0"
description = "CTFBench reproduction using Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.41",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "anyio>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]
